name: Actualizar datos y publicar

on:
  schedule:
    - cron: "0 8 * * *"   # todos los días a las 8:00 UTC (3:00 a. m. en Perú)
  workflow_dispatch:       # permite correrlo a mano desde la pestaña Actions
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Descargar resultados
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python3 update_data.py

      - name: Armar el sitio
        run: |
          mkdir site
          cp index.html site/
          cp -r data site/data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
